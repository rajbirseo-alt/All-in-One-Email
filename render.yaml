# Render Blueprint — SEO Discovery Unified Email CRM (web + API + worker + PostgreSQL).
# Schema: https://render.com/schema/render.yaml.json
#
# Topology: browsers reach only `crm-web`. It proxies /api/* to `crm-api`, a private
# service on Render's private network, so session cookies stay first-party and the API is
# never exposed directly. Provider webhooks also arrive through crm-web.
#
# crm-worker runs mailbox sync, push renewal and the retention purge. Its job queue lives in
# PostgreSQL (pg-boss), so no Redis / Key Value service is needed. It reads its core secrets from
# crm-api so both always use the same ENCRYPTION_KEYS (they decrypt the same mailbox tokens), and
# both read the optional integration keys from the env group crm-integrations.
#
# Secrets marked `sync: false` are entered in the Render Dashboard on first deploy.

projects:
  - name: seo-discovery-crm
    environments:
      - name: production
        databases:
          - name: crm-db
            plan: basic-1gb
            region: singapore # immutable — closest Render region to India
            postgresMajorVersion: "17" # immutable
            databaseName: crm # immutable
            user: crm # immutable
            ipAllowList: [] # private network only

        # Optional integration keys, shared by crm-api and crm-worker: set each once here
        # (Render → Environment Groups → crm-integrations). A key left unset keeps its feature off.
        envVarGroups:
          - name: crm-integrations
            envVars:
              # Employee sign-in and mailbox connection (Phase 2)
              - key: GOOGLE_CLIENT_ID
                sync: false
              - key: GOOGLE_CLIENT_SECRET
                sync: false
              - key: MICROSOFT_CLIENT_ID
                sync: false
              - key: MICROSOFT_CLIENT_SECRET
                sync: false
              - key: MICROSOFT_TENANT_ID
                sync: false
              - key: GMAIL_PUBSUB_TOPIC # optional, enables Gmail push: projects/<project>/topics/gmail-push
                sync: false
              - key: GMAIL_PUSH_SERVICE_ACCOUNT # service account set on the Pub/Sub push subscription
                sync: false
              # Browser push notifications (optional): npx web-push generate-vapid-keys
              - key: VAPID_PUBLIC_KEY
                sync: false
              - key: VAPID_PRIVATE_KEY
                sync: false
              - key: VAPID_SUBJECT # e.g. mailto:it@seodiscovery.com
                sync: false
              # AI assistant (Phase 8). Off until a key is set; mailboxes can opt out in Admin → Mailboxes.
              - key: OPENAI_API_KEY
                sync: false
              - key: OPENAI_MODEL # default gpt-4o-mini
                sync: false
              - key: AI_AUTO_ANALYZE # true (default): analyse new mail automatically
                sync: false
              # Attachments (Phase 10): S3-compatible bucket (e.g. Cloudflare R2), files envelope-encrypted.
              - key: S3_ENDPOINT # e.g. https://<account-id>.r2.cloudflarestorage.com
                sync: false
              - key: S3_REGION # "auto" for R2
                sync: false
              - key: S3_BUCKET
                sync: false
              - key: S3_ACCESS_KEY_ID
                sync: false
              - key: S3_SECRET_ACCESS_KEY
                sync: false
              # Virus scanning (Phase 10): a clamd service on the private network (see docs/runbooks/deploy.md).
              - key: CLAMAV_HOST
                sync: false
              - key: CLAMAV_PORT # default 3310
                sync: false

        services:
          - type: pserv
            name: crm-api
            runtime: node
            plan: starter
            region: singapore
            buildCommand: npm ci --include=dev && npm run build:api
            # Applies migrations and the idempotent role/permission seed before each rollout.
            preDeployCommand: node node_modules/prisma/build/index.js migrate deploy --schema packages/db/prisma/schema.prisma && node packages/db/dist/seed.js
            startCommand: node apps/api/dist/main.js
            autoDeployTrigger: commit
            envVars:
              - key: NODE_VERSION
                value: "24"
              - key: NODE_ENV
                value: production
              - key: DATABASE_URL
                fromDatabase:
                  name: crm-db
                  property: connectionString
              - key: APP_URL # public https origin of crm-web, e.g. https://crm.seodiscovery.com
                sync: false
              - key: ALLOWED_LOGIN_DOMAINS # e.g. seodiscovery.com
                sync: false
              - key: SESSION_SECRET
                generateValue: true
              - key: ENCRYPTION_KEYS # random 256-bit base64 = master key version 1. BACK THIS UP: losing it makes stored secrets unreadable.
                generateValue: true
              - key: PASSWORD_LOGIN_ENABLED
                value: "true"
              # Invited employees may also use Gmail / personal Microsoft accounts.
              - key: PERSONAL_ACCOUNT_LOGIN
                value: "true"
              # Render load balancer → crm-web (Next.js proxy) → crm-api
              - key: TRUST_PROXY_HOPS
                value: "2"
              # Mailboxes (Phase 2)
              - key: MAIL_INITIAL_SYNC_DAYS
                value: "30"
              - key: MAIL_RETENTION_DAYS # decided: mail purged 120 days after disconnect
                value: "120"
              # Reports (Phase 9): days and hours of the dashboards follow this zone.
              - key: REPORT_TIMEZONE
                value: Asia/Kolkata
              # Google / Microsoft / OpenAI / storage / scanner keys: the shared group below.
              - fromGroup: crm-integrations
              # Monitoring (Phase 10): bearer token for GET /api/v1/metrics (Prometheus format). At least 24 characters.
              - key: METRICS_TOKEN
                sync: false

          - type: worker
            name: crm-worker
            runtime: node
            plan: starter
            region: singapore
            buildCommand: npm ci --include=dev && npm run build:api
            startCommand: node apps/api/dist/worker.js
            autoDeployTrigger: commit
            maxShutdownDelaySeconds: 60 # lets a running sync finish on deploy
            envVars:
              - key: NODE_VERSION
                value: "24"
              - key: NODE_ENV
                value: production
              - key: DATABASE_URL
                fromDatabase:
                  name: crm-db
                  property: connectionString
              - key: APP_URL
                fromService:
                  type: pserv
                  name: crm-api
                  envVarKey: APP_URL
              - key: SESSION_SECRET
                fromService:
                  type: pserv
                  name: crm-api
                  envVarKey: SESSION_SECRET
              - key: ENCRYPTION_KEYS
                fromService:
                  type: pserv
                  name: crm-api
                  envVarKey: ENCRYPTION_KEYS
              - key: PERSONAL_ACCOUNT_LOGIN
                fromService:
                  type: pserv
                  name: crm-api
                  envVarKey: PERSONAL_ACCOUNT_LOGIN
              - key: MAIL_INITIAL_SYNC_DAYS
                fromService:
                  type: pserv
                  name: crm-api
                  envVarKey: MAIL_INITIAL_SYNC_DAYS
              - key: MAIL_RETENTION_DAYS
                fromService:
                  type: pserv
                  name: crm-api
                  envVarKey: MAIL_RETENTION_DAYS
              - key: REPORT_TIMEZONE
                fromService:
                  type: pserv
                  name: crm-api
                  envVarKey: REPORT_TIMEZONE
              - fromGroup: crm-integrations

          - type: web
            name: crm-web
            runtime: node
            plan: starter
            region: singapore
            buildCommand: npm ci --include=dev && npm run build:web
            startCommand: npm run start -w @crm/web
            healthCheckPath: /login
            autoDeployTrigger: commit
            envVars:
              - key: NODE_VERSION
                value: "24"
              - key: NODE_ENV
                value: production
              # host:port of the private API; the Next.js config adds http://
              - key: API_INTERNAL_URL
                fromService:
                  type: pserv
                  name: crm-api
                  property: hostport
